{% extends "base.html" %} {% block title %}Log In{% endblock %} {% block head %}
<link rel="stylesheet" href="../static/form-style.css" />
<link rel="icon" type="image/x-icon" href="/static/images/favicon.png" />

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css"
/>{% endblock %} {% block content %}
<div class="main">
  <div class="container" id="main-log-con">
    <div class="signup-content">
      <div class="signup-form">
        <button class="reset-button tooltip">
          <i class="zmdi zmdi-delete"></i>
          <span class="tooltiptext">reset form</span>
        </button>
        <h2 class="form-title">Log In</h2>

        <form
          action="{{ url_for('login') }}"
          method="POST"
          class="login-form"
          id="login-form"
        >
          <span class="error-message" id="username-m"></span>
          <div class="form-group">
            <label for="username"
              ><i class="zmdi zmdi-account-circle material-icons-name"></i
            ></label>
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Your Username"
              class="form-input"
            />
          </div>

          <span class="error-message" id="password-m"></span>

          <div class="form-group">
            <label for="pasword"><i class="zmdi zmdi-lock"></i></label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Password"
              class="form-input"
            />
          </div>
          <span class="error-message">{{ error_message }}</span>

          <div class="form-group form-button">
            <input
              type="submit"
              name="signup"
              id="signup"
              class="form-submit"
              value="Log In"
            />
            <p class="message">
              dont have an account?
              <a href="/signup" class="form-link">create account</a>
            </p>
          </div>
        </form>
      </div>
      <div class="signup-image">
        <figure>
          <img
            src="../static/images/login-image.svg"
            alt="sign up image"
            class="image"
          />
        </figure>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block script %}
<script src="../static/validation.js" defer></script>
{% endblock %}
